name: Mobile app checks

on:
  pull_request:
    paths:
      - "android/**"
      - "web/**"
      - "web_app.py"
      - "voice_realtime.py"
      - "accounts.py"
      - "tests/**"
      - "requirements.txt"
      - "docs/MOBILE_PRODUCT_AND_SECURITY.md"
      - ".github/workflows/android-build.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "web/**"
      - "web_app.py"
      - "voice_realtime.py"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run API and account tests
        run: python -m unittest discover -s tests -v

  docker-image-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build -t ai-hub-voice-ci .
      - name: Verify application imports inside production image
        run: docker run --rm --entrypoint python ai-hub-voice-ci -c "import web_app; print('AI HUB production image imports successfully')"

  web-js-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract and syntax-check the web client
        run: |
          python3 -c 'import pathlib,re; s=pathlib.Path("web/index.html").read_text(); blocks=re.findall(r"<script>(.*?)</script>",s,re.S); assert blocks, "No inline client script found"; pathlib.Path("/tmp/ai-hub-client.js").write_text(blocks[-1])'
          node --check /tmp/ai-hub-client.js
          node --check web/service-worker.js

  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-hub-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
