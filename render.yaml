services:
  - type: web
    runtime: docker
    name: ai-hub-web
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_PROVIDERS_JSON
        value: "[]"
      - key: HUB_ACCESS_PASSWORD
        sync: false
      - key: HUB_SESSION_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
