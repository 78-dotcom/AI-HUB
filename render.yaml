services:
  - type: web
    runtime: docker
    name: AI-HUB
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_PROVIDERS_JSON
        value: "[]"
      - key: HUB_ACCESS_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: HUB_SIGNUP_CODE
        sync: false
      - key: HUB_SESSION_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
