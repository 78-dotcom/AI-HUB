services:
  - type: web
    runtime: docker
    name: AI-HUB
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BILLING_TIER
        value: free
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: GEMINI_LIVE_VOICE
        value: Aoede
      - key: AI_PROVIDERS_JSON
        value: "[]"
      - key: HUB_ACCESS_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: HUB_SIGNUP_CODE
        sync: false
      - key: HUB_SESSION_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
