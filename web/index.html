function handleRealtimeVoiceEvent(raw){let event;try{event=JSON.parse(raw)}catch{return}if(event.type==="conversation.item.input_audio_transcription.completed"){const transcript=String(event.transcript||"").trim();if(transcript){liveVoicePendingUsers.push(transcript);liveVoiceStatus((lang==="ru"?"Распознано: ":"Heard: ")+transcript);flushRealtimeVoiceTranscripts()}}else if(event.type==="response.output_audio_transcript.done"||event.type==="response.output_text.done"){const transcript=String(event.transcript||event.text||"").trim();if(transcript){liveVoicePendingAssistants.push(transcript);flushRealtimeVoiceTranscripts()}}else if(event.type==="input_audio_buffer.speech_started"){liveVoiceStatus(lang==="ru"?"Слушаю…":"Listening…")}else if(event.type==="session.closed"){stopRealtimeVoice(lang==="ru"?"Голосовой разговор завершён сервером AI HUB.":"Voice conversation ended by AI HUB server.")}else if(event.type==="error"){const message=event.error&&event.error.message?event.error.message:t().voiceConversationError;liveVoiceStatus(message)}}
async function toggleRealtimeVoice(){if(liveVoice){await stopRealtimeVoice();return}const providerId=$("voiceProvider")?.value||selectedVoiceProvider;const provider=voiceProviders.find(p=>p.id===providerId);if(!provider){liveVoiceStatus(t().voiceConversationUnavailable);return}if(!confirmPaidVoiceProvider(provider))return;if(providerId==="gemini"){await toggleGeminiLiveVoice();return}const button=$("voiceConversation");if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia||!window.RTCPeerConnection){liveVoiceStatus(t().voiceConversationUnsupported);return}button.disabled=true;liveVoiceStatus(t().voiceConversationConnecting);let stream=null,pc=null,audio=null;try{const capabilities=await api("/api/voice/capabilities");if(!capabilities.realtime_voice)throw new Error(t().voiceConversationUnavailable);stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});const token=await api("/api/voice/session",{method:"POST",body:JSON.stringify({language:lang})});pc=new RTCPeerConnection();audio=document.createElement("audio");audio.autoplay=true;audio.playsInline=true;audio.hidden=true;document.body.appendChild(audio);pc.ontrack=event=>{audio.srcObject=event.streams[0];audio.play().catch(()=>liveVoiceStatus(lang==="ru"?"Нажмите на страницу, чтобы включить звук.":"Tap the page to enable audio playback."))};stream.getTracks().forEach(track=>pc.addTrack(track,stream));const channel=pc.createDataChannel("oai-events");channel.onmessage=event=>handleRealtimeVoiceEvent(event.data);channel.onopen=()=>liveVoiceStatus(t().voiceConversationListening);channel.onerror=()=>liveVoiceStatus(t().voiceConversationError);const offer=await pc.createOffer();await pc.setLocalDescription(offer);const response=await fetch("https://api.openai.com/v1/realtime/calls",{method:"POST",headers:{"Authorization":"Bearer "+token.client_secret,"Content-Type":"application/sdp"},body:pc.localDescription.sdp});if(!response.ok)throw new Error(t().voiceConversationError);const answer=await response.text();const location=response.headers.get("Location");const callId=location?location.split("/").pop():null;if(!callId)throw new Error(t().voiceConversationError);const control=await api("/api/voice/attach",{method:"POST",body:JSON.stringify({call_id:callId,model:token.model})});await pc.setRemoteDescription({type:"answer",sdp:answer});liveVoice={provider:"openai",pc,stream,audio,channel,model:token.model,callId,serverControlled:true,startedAt:control.started_at*1000,endsAt:control.ends_at*1000,timer:null,warned:false};ensureLiveVoiceThread();render();drawMessages();const liveButton=$("voiceConversation");liveButton.disabled=false;liveButton.setAttribute("aria-pressed","true");liveButton.textContent="■ "+t().voiceConversationStop;pc.onconnectionstatechange=()=>{if(pc.connectionState==="failed"||pc.connectionState==="closed"){liveVoiceStatus(t().voiceConversationError);stopRealtimeVoice()}};updateLiveVoiceTimer();liveVoice.timer=setInterval(updateLiveVoiceTimer,1000);liveVoiceStatus(t().voiceConversationListening)}catch(error){try{if(pc)pc.close()}catch{}try{if(stream)stream.getTracks().forEach(track=>track.stop())}catch{}try{if(audio)audio.remove()}catch{}button.disabled=false;button.setAttribute("aria-pressed","false");button.textContent="◉ "+t().voiceConversationStart;liveVoiceStatus(error.message||t().voiceConversationError)}}

document.addEventListener("visibilitychange",()=>{if(liveVoice)updateLiveVoiceTimer()});
async function send(){if(recognition){voicePendingSend=true;recognition.stop();return}if(busy||!models.length)return;const input=$("prompt"),text=input.value.trim();if(!text)return;if(!selected)selected=models[0]?.id||"";let th=threads.find(x=>x.id===active);if(!th){th={id:String(Date.now()),title:text.slice(0,38),messages:[]};threads.unshift(th);active=th.id}th.messages.push({role:"user",content:text});input.value="";save();render();busy=true;$("send").disabled=true;$("send").textContent=t().thinking;drawMessages();try{const result=await api("/api/chat",{method:"POST",body:JSON.stringify({model:selected,messages:th.messages.slice(-20),conversation_id:accountMode?th.serverId||null:null})});if(result.conversation_id)th.serverId=result.conversation_id;th.messages.push({role:"assistant",content:result.answer});save()}catch(e){th.messages.push({role:"assistant",content:"⚠ "+e.message});save()}finally{busy=false;render();drawMessages();$("prompt").focus()}}
async function logout(){try{await api("/api/logout",{method:"POST",body:"{}"})}catch{}location.reload()}
async function start(){try{const state=await api("/api/session");if(!state.authenticated)return;accountMode=false;threads=[];let prefs=null;try{const me=await api("/api/auth/me");accountMode=true;storageKey="aihub-threads-"+me.user.id;prefs=await api("/api/preferences");if(copy[prefs.language]){lang=prefs.language;localStorage.setItem("aihub-lang",lang)}const saved=await api("/api/conversations");for(const item of saved.conversations||[]){threads.push({id:item.id,serverId:item.id,title:item.title,messages:item.messages||[]})}}catch(e){if(accountMode){$("loginError").textContent="Could not load your account data: "+e.message;return}threads=JSON.parse(localStorage.getItem("aihub-threads-workspace")||"[]")}const data=await api("/api/models");models=data.models||[];selected=(prefs&&prefs.preferred_model&&(prefs.preferred_model==="auto"||models.some(m=>m.id===prefs.preferred_model))?prefs.preferred_model:"auto")||data.default||models[0]?.id||"";render()}catch(e){$("loginError").textContent=e.message}}
$("login").onclick=async()=>{try{await api("/api/login",{method:"POST",body:JSON.stringify({password:$("password").value})});start()}catch(e){$("loginError").textContent=e.message}};
$("password").onkeydown=e=>{if(e.key==="Enter")$("login").click()};
$("useAccount").onclick=async()=>{$("workspacePanel").hidden=true;$("accountPanel").hidden=false;try{const status=await api("/api/auth/status");$("accountRegister").hidden=!status.registration_enabled;$("accountSignIn").disabled=!status.database_configured;if(!status.database_configured)$("accountError").textContent="Individual accounts are not configured yet. Use the workspace password for now."}catch(e){$("accountError").textContent=e.message}};
$("useWorkspace").onclick=()=>{$("accountPanel").hidden=true;$("workspacePanel").hidden=false};
$("accountSignIn").onclick=async()=>{try{await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:$("accountEmail").value,password:$("accountPassword").value})});start()}catch(e){$("accountError").textContent=e.message}};
$("accountRegister").onclick=async()=>{if($("inviteCode").hidden){$("inviteCode").hidden=false;$("accountRegister").textContent="Create account";$("accountError").textContent="Enter the invitation code provided by the AI HUB administrator.";return}try{await api("/api/auth/register",{method:"POST",body:JSON.stringify({email:$("accountEmail").value,password:$("accountPassword").value,invite_code:$("inviteCode").value})});start()}catch(e){$("accountError").textContent=e.message}};
start();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("/service-worker.js").catch(err => console.warn("AI HUB offline shell unavailable", err))); }
