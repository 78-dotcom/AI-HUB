<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131b"><meta name="description" content="AI HUB — one workspace for the AI models you choose.">
<title>AI HUB — Your AI workspace</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#171c27;--panel2:#1d2431;--line:#2a3342;--text:#f2f5fa;--muted:#929daf;--accent:#8b7cff;--accent2:#5fcbba;--danger:#ff8585}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{background:#131822;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:18px;letter-spacing:.04em}.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#8b7cff,#5fcbba);display:grid;place-items:center;color:#111522;font-weight:900}.newchat{border:1px solid #3a4354;background:#202737;border-radius:12px;padding:11px 13px;text-align:left;font-weight:650}.newchat:hover,.ghost:hover{background:#293246}.side-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:0 8px}.history{display:grid;gap:5px}.history button{border:0;background:transparent;text-align:left;color:#b6c0cf;border-radius:9px;padding:9px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button.active,.history button:hover{background:#222a39;color:white}.side-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}.topbar{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:16px}.top-left{display:flex;align-items:center;gap:12px}.topbar h1{font-size:15px;margin:0;font-weight:650}.pill{font-size:11px;color:#a8a0ff;background:#282440;border:1px solid #403a67;padding:4px 9px;border-radius:20px}.top-actions{display:flex;align-items:center;gap:10px}.ghost{background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:#c1cad8}.content{width:min(920px,100%);margin:0 auto;padding:48px 28px 22px;display:flex;flex-direction:column;flex:1}.welcome{margin:auto auto 35px;text-align:center;max-width:620px}.orb{width:58px;height:58px;margin:0 auto 22px;border-radius:20px;background:linear-gradient(145deg,#8b7cff,#5fcbba);display:grid;place-items:center;color:#111522;font-size:25px;box-shadow:0 12px 50px #7767ff33}.welcome h2{font-size:clamp(27px,4vw,38px);letter-spacing:-.04em;margin:0 0 10px}.welcome p{color:var(--muted);margin:0}.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:28px;text-align:left}.suggestion{border:1px solid var(--line);background:var(--panel);padding:13px 15px;border-radius:12px;color:#d7deea;text-align:left}.suggestion:hover{border-color:#6c61b5;background:#1c2230}.suggestion small{display:block;color:var(--muted);margin-top:3px}.messages{display:flex;flex-direction:column;gap:22px;padding:0 0 26px}.msg{display:flex;gap:12px;align-items:flex-start}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:10px;background:#282440;color:#b9b0ff;display:grid;place-items:center;font-size:13px;font-weight:700}.msg.user .avatar{background:#253b3a;color:#83decf}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;padding:4px 0;max-width:100%;color:#e5eaf2}.msg.user .bubble{background:#1c2431;border:1px solid #2c3647;border-radius:13px;padding:11px 14px}.composer-wrap{position:sticky;bottom:0;padding:14px 0 8px;background:linear-gradient(transparent,var(--bg) 18%)}.composer{border:1px solid #394355;background:#191f2b;border-radius:16px;padding:12px;box-shadow:0 12px 45px #0003}.composer-top{display:flex;align-items:center;gap:10px;padding:0 3px 8px}.composer select{background:#222a39;color:#dfe5ee;border:1px solid #343e50;border-radius:8px;padding:6px 9px;max-width:min(100%,380px);font-size:12px}.composer textarea{width:100%;resize:none;min-height:56px;max-height:180px;background:transparent;border:0;outline:0;color:var(--text);padding:8px 4px}.composer-bottom{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}.send{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:8px 15px;font-weight:700}.send:disabled{opacity:.45;cursor:default}.hint{text-align:center;color:#687487;font-size:11px;padding:8px 0 0}.empty{color:var(--muted);text-align:center;padding:30px}.login-screen{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,100%);border:1px solid var(--line);background:var(--panel);padding:34px;border-radius:20px;box-shadow:0 24px 90px #0005}.login-card .brand{justify-content:center;margin-bottom:28px}.login-card h2{text-align:center;margin:0 0 8px;font-size:25px}.login-card p{text-align:center;color:var(--muted);margin:0 0 25px}.login-card input{width:100%;background:#10151f;border:1px solid #394355;border-radius:10px;padding:12px;color:white;outline:0}.login-card button{width:100%;margin-top:12px}.error{color:var(--danger);font-size:12px;min-height:20px;margin-top:9px}.mobile-brand{display:none}
@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{display:none}.topbar{height:60px;padding:0 16px}.mobile-brand{display:flex}.topbar h1{display:none}.content{padding:32px 16px 12px}.suggestions{grid-template-columns:1fr}.welcome{margin-top:auto}.composer{padding:10px}.composer select{max-width:65vw}.hint{font-size:10px}}
</style>
</head>
<body>
<div id="app"><div class="login-screen"><div class="login-card"><div class="brand"><span class="mark">✳</span> AI HUB</div>
<div id="workspacePanel"><h2>One space. Many minds.</h2><p>Your personal workspace for the AI models you choose.</p><input id="password" type="password" placeholder="Workspace password" autocomplete="current-password"><button class="send" id="login">Continue</button><div class="error" id="loginError"></div><button class="ghost" id="useAccount" style="width:100%;margin-top:14px">Sign in with an account</button></div>
<div id="accountPanel" hidden><h2>Welcome back</h2><p>Sign in with your AI HUB account.</p><input id="accountEmail" type="email" placeholder="Email address" autocomplete="email"><input id="accountPassword" type="password" placeholder="Password (12+ characters)" autocomplete="current-password" style="margin-top:10px"><input id="inviteCode" type="password" placeholder="Invitation code" autocomplete="off" hidden style="margin-top:10px"><button class="send" id="accountSignIn">Sign in</button><button class="ghost" id="accountRegister" style="width:100%;margin-top:10px" hidden>Create account with invitation</button><div class="error" id="accountError"></div><button class="ghost" id="useWorkspace" style="width:100%;margin-top:8px">Use workspace password instead</button></div>
</div></div></div>
<script>
const copy={
en:{title:"Your AI workspace",welcome:"What would you like to explore?",sub:"Choose a model and start a conversation. Your workspace, your choice.",ideas:[["Write something","Draft an email, post or story"],["Understand a topic","Explain a complex idea simply"],["Build an idea","Turn a rough thought into a plan"],["Solve a problem","Think through a challenge step by step"]],placeholder:"Message AI HUB…",send:"Send",new:"New chat",recent:"Recent",empty:"No conversations yet",thinking:"Thinking…",failed:"Something went wrong. Please try again.",locked:"Sign in to your private AI HUB workspace.",noModels:"No AI models are configured yet. Add your provider API key in Render.",disclaimer:"AI can make mistakes. Check important information.",model:"Choose a model",logout:"Sign out"},
ru:{title:"Твоё пространство ИИ",welcome:"Что будем исследовать?",sub:"Выбери модель и начни диалог. Твоё пространство — твой выбор.",ideas:[["Написать текст","Письмо, публикация или история"],["Разобраться в теме","Объяснить сложную идею просто"],["Развить идею","Превратить мысль в план"],["Решить задачу","Разобрать проблему по шагам"]],placeholder:"Напиши сообщение AI HUB…",send:"Отправить",new:"Новый чат",recent:"Недавние",empty:"Диалогов пока нет",thinking:"Думаю…",failed:"Не удалось выполнить запрос. Попробуй ещё раз.",locked:"Войди в закрытое пространство AI HUB.",noModels:"Модели пока не настроены. Добавь API-ключ провайдера в Render.",disclaimer:"ИИ может ошибаться. Проверяй важную информацию.",model:"Выбери модель",logout:"Выйти"}
};
let lang=localStorage.getItem("aihub-lang")||"en",models=[],selected="",threads=[],active=null,busy=false;
const $=id=>document.getElementById(id),t=()=>copy[lang];
async function api(path,options={}){const res=await fetch(path,{credentials:"same-origin",headers:{"Content-Type":"application/json",...(options.headers||{})},...options});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.detail||t().failed);return data}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){localStorage.setItem("aihub-threads",JSON.stringify(threads))}
function render(){const app=$("app");app.innerHTML=`
<div class="shell"><aside class="sidebar"><div class="brand"><span class="mark">✳</span> AI HUB</div><button class="newchat" id="newChat">＋ &nbsp;${t().new}</button><div><div class="side-label">${t().recent}</div><div class="history" id="history"></div></div><div class="side-bottom"><span>AI HUB · Preview</span><button class="ghost" id="logout">${t().logout}</button></div></aside>
<main class="main"><header class="topbar"><div class="top-left"><div class="brand mobile-brand"><span class="mark">✳</span> AI HUB</div><h1>${t().title}</h1><span class="pill">EARLY ACCESS</span></div><div class="top-actions"><button class="ghost" id="language">${lang==="en"?"RU":"EN"}</button><button class="ghost" id="mobileNew">＋</button></div></header>
<section class="content"><div id="welcome" class="welcome"><div class="orb">✳</div><h2>${t().welcome}</h2><p>${t().sub}</p><div class="suggestions">${t().ideas.map((x,i)=>`<button class="suggestion" data-idea="${i}">${esc(x[0])}<small>${esc(x[1])}</small></button>`).join("")}</div></div><div id="messages" class="messages"></div><div class="composer-wrap"><div class="composer"><div class="composer-top"><span style="color:var(--muted);font-size:12px">${t().model}</span><select id="modelSelect" aria-label="AI model">${models.map(m=>`<option value="${esc(m.id)}" ${m.id===selected?"selected":""}>${esc(m.provider_name)} · ${esc(m.model)}</option>`).join("")}</select></div><textarea id="prompt" rows="2" placeholder="${t().placeholder}"></textarea><div class="composer-bottom"><span>↵ Enter to send · Shift + Enter for new line</span><button class="send" id="send">${t().send} ↑</button></div></div><div class="hint">${t().disclaimer}</div></div></section></main></div>`;
const history=$("history");if(!threads.length)history.innerHTML=`<div class="empty">${t().empty}</div>`;else history.innerHTML=threads.map(th=>`<button data-thread="${th.id}" class="${th.id===active?"active":""}">${esc(th.title)}</button>`).join("");
$("newChat").onclick=$("mobileNew").onclick=newThread;$("logout").onclick=logout;$("language").onclick=()=>{lang=lang==="en"?"ru":"en";localStorage.setItem("aihub-lang",lang);render()};$("send").onclick=send;$("modelSelect").onchange=e=>{selected=e.target.value;};
$("prompt").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
document.querySelectorAll("[data-idea]").forEach(b=>b.onclick=()=>{$("prompt").value=t().ideas[Number(b.dataset.idea)][0]+": ";$("prompt").focus()});
document.querySelectorAll("[data-thread]").forEach(b=>b.onclick=()=>{active=b.dataset.thread;render();drawMessages()});
if(!models.length){$("modelSelect").innerHTML='<option value="">No models available</option>';$("send").disabled=true}
drawMessages();
}
function newThread(){active=null;render();$("prompt").focus()}
function drawMessages(){const th=threads.find(x=>x.id===active),box=$("messages"),welcome=$("welcome");if(!th||!th.messages.length){welcome.style.display="block";box.innerHTML="";return}welcome.style.display="none";box.innerHTML=th.messages.map(m=>`<div class="msg ${m.role}"><div class="avatar">${m.role==="user"?"Y":"✳"}</div><div class="bubble">${esc(m.content)}</div></div>`).join("");box.scrollTop=box.scrollHeight}
async function send(){if(busy||!models.length)return;const input=$("prompt"),text=input.value.trim();if(!text)return;if(!selected)selected=models[0]?.id||"";let th=threads.find(x=>x.id===active);if(!th){th={id:String(Date.now()),title:text.slice(0,38),messages:[]};threads.unshift(th);active=th.id}th.messages.push({role:"user",content:text});input.value="";save();render();busy=true;$("send").disabled=true;$("send").textContent=t().thinking;drawMessages();try{const result=await api("/api/chat",{method:"POST",body:JSON.stringify({model:selected,messages:th.messages.slice(-20)})});th.messages.push({role:"assistant",content:result.answer});save()}catch(e){th.messages.push({role:"assistant",content:"⚠ "+e.message});save()}finally{busy=false;render();drawMessages();$("prompt").focus()}}
async function logout(){try{await api("/api/logout",{method:"POST",body:"{}"})}catch{}location.reload()}
async function start(){try{const state=await api("/api/session");if(!state.authenticated)return;threads=JSON.parse(localStorage.getItem("aihub-threads")||"[]");const data=await api("/api/models");models=data.models||[];selected=data.default||models[0]?.id||"";render()}catch(e){$("loginError").textContent=e.message}}
$("login").onclick=async()=>{try{await api("/api/login",{method:"POST",body:JSON.stringify({password:$("password").value})});start()}catch(e){$("loginError").textContent=e.message}};
$("password").onkeydown=e=>{if(e.key==="Enter")$("login").click()};
$("useAccount").onclick=async()=>{$("workspacePanel").hidden=true;$ ("accountPanel").hidden=false;try{const status=await api("/api/auth/status");$("accountRegister").hidden=!status.registration_enabled}catch(e){$("accountError").textContent=e.message}};
$("useWorkspace").onclick=()=>{$("accountPanel").hidden=true;$ ("workspacePanel").hidden=false};
$("accountSignIn").onclick=async()=>{try{await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:$("accountEmail").value,password:$("accountPassword").value})});start()}catch(e){$("accountError").textContent=e.message}};
$("accountRegister").onclick=async()=>{try{await api("/api/auth/register",{method:"POST",body:JSON.stringify({email:$("accountEmail").value,password:$("accountPassword").value,invite_code:$("inviteCode").value})});start()}catch(e){$("accountError").textContent=e.message}};
start();
</script>
</body></html>
