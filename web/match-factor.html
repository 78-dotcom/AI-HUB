<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131b"><title>Match-Factor · AI HUB</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#171c27;--panel2:#1d2431;--line:#2a3342;--text:#f2f5fa;--muted:#929daf;--accent:#8b7cff;--good:#5fcbba;--bad:#ff8585}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}header{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 1050px)/2))}.brand{font-weight:800;display:flex;align-items:center;gap:10px}.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#8b7cff,#5fcbba);display:grid;place-items:center;color:#111522}button,select{font:inherit;color:inherit;cursor:pointer}.ghost{border:1px solid var(--line);background:transparent;border-radius:9px;padding:7px 11px;color:#c1cad8}main{width:min(1050px,100%);margin:auto;padding:28px 18px 60px}.heading{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:20px}.heading h1{margin:0;font-size:27px}.heading p{margin:5px 0;color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:15px}.controls{display:grid;grid-template-columns:minmax(200px,1fr) auto auto;gap:12px;align-items:end}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}select{width:100%;background:#222a39;border:1px solid #394355;border-radius:9px;padding:10px}.checks{display:flex;gap:10px;align-items:center;min-height:42px}.checks label{margin:0;color:#d7deea;display:flex;gap:5px;align-items:center;font-size:12px}.primary{border:0;background:var(--accent);border-radius:9px;padding:10px 16px;font-weight:700}.status{font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}.status strong{color:#e5eaf2}.notice{color:var(--muted);font-size:12px;margin-top:8px}.event{padding:15px 0;border-top:1px solid var(--line)}.event:first-child{border-top:0;padding-top:0}.event-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.teams{font-weight:700}.time{color:var(--muted);font-size:12px}.book{margin-top:9px;background:var(--panel2);border-radius:10px;padding:10px 12px}.book-title{font-size:12px;color:var(--muted);margin-bottom:7px}.market{margin-top:8px}.market-name{font-size:11px;color:var(--muted);text-transform:uppercase}.outcomes{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}.odd{border:1px solid #354052;border-radius:8px;padding:6px 9px;font-size:12px}.odd b{color:var(--good);margin-left:5px}.empty{text-align:center;color:var(--muted);padding:22px 0}.error{color:var(--bad)}@media(max-width:720px){header{height:58px;padding:0 13px}main{padding:22px 13px}.controls{grid-template-columns:1fr}.checks{min-height:auto}.heading h1{font-size:23px}}
</style></head><body>
<header><div class="brand"><span class="mark">✳</span> AI HUB <span style="color:var(--muted);font-weight:500">/ Match-Factor</span></div><div style="display:flex;gap:8px"><button class="ghost" id="back">AI HUB</button><button class="ghost" id="lang">RU</button></div></header>
<main><div class="heading"><div><h1 id="title">Match-Factor</h1><p id="subtitle">Live odds and markets from The Odds API</p></div><span class="ghost" id="connection">Checking connection…</span></div>
<section class="panel"><div class="controls"><div><label id="sportLabel" for="sport">Sport</label><select id="sport"><option>Loading sports…</option></select></div><div><label id="marketLabel">Markets</label><div class="checks"><label><input type="checkbox" value="h2h" checked> Moneyline / 1X2</label><label><input type="checkbox" value="spreads"> Handicap</label><label><input type="checkbox" value="totals"> Totals</label></div></div><button class="primary" id="load">Get odds</button></div><div class="status" id="usage"></div><div class="notice" id="costNote">EU region. Credits are charged per market × region. Sports list is free; odds are cached for 90 seconds.</div></section>
<section class="panel"><div id="results" class="empty">Choose a sport and load current odds.</div></section></main>
<script>
var lang=localStorage.getItem("aihub-lang")==="ru"?"ru":"en",sports=[];
var $=function(id){return document.getElementById(id)};
var words={
en:{title:"Match-Factor",subtitle:"Live odds and markets from The Odds API",sport:"Sport",markets:"Markets",load:"Get odds",loading:"Loading…",empty:"No events with odds were returned.",choose:"Choose a sport and load current odds.",back:"AI HUB",connected:"API key configured",missing:"API key not configured in Render",used:"Used",remaining:"Remaining",last:"Last request cost",error:"Could not load data",cached:"Cached result",fresh:"Live result",start:"Starts",noBooks:"No bookmaker prices in this response.",cost:"EU region. Credits are charged per market × region. Sports list is free; odds are cached for 90 seconds.",marketNames:{h2h:"Moneyline / 1X2",spreads:"Handicap",totals:"Totals"}},
ru:{title:"Матч-Фактор",subtitle:"Актуальные коэффициенты через The Odds API",sport:"Вид спорта",markets:"Рынки",load:"Получить котировки",loading:"Загрузка…",empty:"По выбранным параметрам котировки не найдены.",choose:"Выбери вид спорта и загрузи котировки.",back:"AI HUB",connected:"API-ключ настроен",missing:"API-ключ не добавлен в Render",used:"Использовано",remaining:"Осталось",last:"Стоимость последнего запроса",error:"Не удалось загрузить данные",cached:"Данные из кэша",fresh:"Свежие котировки",start:"Начало",noBooks:"В ответе нет букмекерских котировок.",cost:"Регион EU. Кредиты расходуются по формуле: число рынков × регион. Список видов спорта бесплатный; котировки кэшируются на 90 секунд.",marketNames:{h2h:"Победа / 1X2",spreads:"Фора",totals:"Тоталы"}}
};
var w=function(){return words[lang]};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function setLang(){document.documentElement.lang=lang;$("title").textContent=w().title;$("subtitle").textContent=w().subtitle;$("sportLabel").textContent=w().sport;$("marketLabel").textContent=w().markets;$("load").textContent=w().load;$("back").textContent=w().back;$("lang").textContent=lang==="en"?"RU":"EN";$("costNote").textContent=w().cost}
async function api(path){var r=await fetch(path,{credentials:"same-origin"}),d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.detail||w().error);return d}
function showUsage(data){var u=data.usage||{};var a=[];if(u.requests_used!=null)a.push(w().used+": <strong>"+esc(u.requests_used)+"</strong>");if(u.requests_remaining!=null)a.push(w().remaining+": <strong>"+esc(u.requests_remaining)+"</strong>");if(u.last_request_cost!=null)a.push(w().last+": <strong>"+esc(u.last_request_cost)+"</strong>");$("usage").innerHTML=a.join(" &nbsp; · &nbsp; ")}
async function init(){try{var s=await api("/api/match-factor/status");$("connection").textContent=s.configured?w().connected:w().missing;$("connection").style.color=s.configured?"var(--good)":"var(--bad)";showUsage(s);var d=await api("/api/match-factor/sports");sports=d.sports||[];$("sport").innerHTML=sports.map(function(x){return '<option value="'+esc(x.key)+'">'+esc(x.title)+'</option>'}).join("")||'<option value="">No active sports</option>';if(!s.configured)$("results").innerHTML='<div class="empty error">'+w().missing+'. Add ODDS_API_KEY to the AI-HUB service environment on Render.</div>'}catch(e){$("connection").textContent=w().error;$("results").innerHTML='<div class="empty error">'+esc(e.message)+'</div>'}}
function renderOdds(data){showUsage(data);var rows=data.odds||[];if(!rows.length){$("results").innerHTML='<div class="empty">'+w().empty+'</div>';return}var out='<div class="status" style="margin:0 0 12px"><span>'+(data.cached?w().cached:w().fresh)+'</span><span>'+rows.length+' events</span></div>';rows.forEach(function(ev){out+='<article class="event"><div class="event-head"><div class="teams">'+esc(ev.away_team)+' — '+esc(ev.home_team)+'</div><div class="time">'+w().start+': '+(ev.commence_time?new Date(ev.commence_time).toLocaleString():"—")+'</div></div>';var books=ev.bookmakers||[];if(!books.length)out+='<div class="notice">'+w().noBooks+'</div>';books.forEach(function(b){out+='<div class="book"><div class="book-title">'+esc(b.title||b.key)+'</div>';(b.markets||[]).forEach(function(m){out+='<div class="market"><div class="market-name">'+esc(w().marketNames[m.key]||m.key)+'</div><div class="outcomes">';(m.outcomes||[]).forEach(function(o){out+='<span class="odd">'+esc(o.name)+(o.point!==undefined?' ('+esc(o.point)+')':'')+'<b>'+Number(o.price).toFixed(2)+'</b></span>'});out+='</div></div>'});out+='</div>'});out+='</article>'});$("results").innerHTML=out}
$("load").onclick=async function(){var sport=$("sport").value,markets=Array.from(document.querySelectorAll(".checks input:checked")).map(function(x){return x.value});if(!sport)return;$("load").disabled=true;$("load").textContent=w().loading;$("results").innerHTML='<div class="empty">'+w().loading+'</div>';try{var d=await api("/api/match-factor/odds?sport_key="+encodeURIComponent(sport)+"&markets="+encodeURIComponent(markets.join(",")));renderOdds(d)}catch(e){$("results").innerHTML='<div class="empty error">'+esc(e.message)+'</div>'}finally{$("load").disabled=false;$("load").textContent=w().load}};
$("back").onclick=function(){location.href="/"};$("lang").onclick=function(){lang=lang==="en"?"ru":"en";localStorage.setItem("aihub-lang",lang);setLang()};setLang();init();
</script></body></html>
